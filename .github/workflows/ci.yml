name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.0.0
        with:
          args: "check app/"

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        # Exit code 5 means "no tests collected" — passes as a placeholder
        # until real tests are written. All other non-zero codes fail the job.
        # set +e disables the shell's "exit immediately on error" flag so we
        # can capture pytest's exit code before deciding what to do with it.
        run: |
          set +e
          pytest app/ -q
          EXIT=$?
          set -e
          if [ $EXIT -eq 5 ]; then
            echo "No tests found — placeholder passing until tests are written"
            exit 0
          fi
          exit $EXIT

  build:
    runs-on: ubuntu-latest
    needs: [lint, hadolint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ github.event.pull_request.updated_at }}
