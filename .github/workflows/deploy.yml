name: Deploy

on:
  push:
    branches: [main]

# Required for OIDC token exchange with AWS.
permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute short SHA
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Build and push to ECR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/guestbook:${{ steps.meta.outputs.sha }}
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.sha }}
            BUILT_AT=${{ github.event.head_commit.timestamp }}

  update-gitops:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      # Check out the gitops repo using the deploy PAT so we can push back.
      - uses: actions/checkout@v7
        with:
          repository: panethjonathan8-ctrl/guestbook-gitops
          token: ${{ secrets.GH_DEPLOY_PAT }}

      - name: Update dev image tag
        run: |
          sed -i 's|tag: ".*"|tag: "${{ needs.build-and-push.outputs.image_tag }}"|' \
            charts/guestbook/values-dev.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/guestbook/values-dev.yaml
          git commit -m "deploy: guestbook-app@${{ needs.build-and-push.outputs.image_tag }}"
          git push

  deploy-dev:
    runs-on: ubuntu-latest
    needs: [build-and-push, update-gitops]
    environment: dev
    steps:
      - name: Checkout gitops repo
        uses: actions/checkout@v7
        with:
          repository: panethjonathan8-ctrl/guestbook-gitops
          token: ${{ secrets.GH_DEPLOY_PAT }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ vars.AWS_REGION }} \
            --name ${{ vars.EKS_CLUSTER_NAME }}

      - name: Deploy via Helm
        run: |
          helm upgrade --install guestbook charts/guestbook \
            -f charts/guestbook/values-dev.yaml \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --set externalSecret.enabled=false \
            --namespace guestbook \
            --create-namespace \
            --wait \
            --timeout 5m
