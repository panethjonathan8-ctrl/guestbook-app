name: release-please

# Runs on every push to main (i.e. every squash-merge). release-please reads
# the Conventional Commit messages since the last release tag and opens/
# updates a single "chore: release X.Y.Z" PR with the computed version bump
# and changelog. Merging that PR is what actually creates the git tag and
# GitHub Release.
#
# The moment that merge cuts a real release, this workflow also promotes it
# to staging and prod. It does NOT rebuild anything: it finds the dev image
# already built (by deploy.yml) for the release's underlying app code, adds
# the release version as a second tag on that same image in ECR, and deploys
# that. Dev is untouched here — it deploys continuously on every push via
# deploy.yml, independent of releases.
#
# release-please-action authenticates with a PAT (GH_RELEASE_PAT), not the
# default GITHUB_TOKEN. GitHub deliberately blocks workflows from actually
# running when triggered by content authored via the default GITHUB_TOKEN —
# without a real PAT, ci.yml's pull_request trigger would never fire on the
# Release PR, so its required checks (build/hadolint/lint/test) could never
# pass, and auto-merge would wait forever. This is a separate concern from
# the jobs below (resolve-image/promote-staging/promote-prod), which run
# inside this SAME workflow run reading release-please's step outputs
# directly — those never depended on a second triggered event.
on:
  push:
    branches:
      - main

# Ceiling for what any job below may request. Each job narrows this down to
# only what it actually needs.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GH_RELEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Only needed to get scripts/automerge-release-pr.sh onto the runner —
      # release-please-action itself talks to the GitHub API directly and
      # never needed a checkout.
      #
      # Runs unconditionally (not gated on prs_created) — a Release PR can
      # already be open from an earlier run that didn't touch it (e.g. a
      # hidden-type commit release-please decided not to update the PR for).
      # automerge-release-pr.sh already no-ops safely if no PR is open, so
      # there's no need to guess whether this run touched one.
      - uses: actions/checkout@v7

      # Uses GH_RELEASE_PAT, not the default GITHUB_TOKEN — GitHub's
      # anti-recursion protection blocks further workflow runs from being
      # triggered by anything performed via GITHUB_TOKEN, and that turned
      # out to include auto-merges scheduled with it, not just direct
      # pushes. Without this, the Release PR merges but release-please.yml
      # never runs again — no tag, no GitHub Release, no staging/prod
      # promotion, even though the merge itself looks clean.
      - name: Auto-merge the Release PR
        run: |
          chmod +x scripts/automerge-release-pr.sh
          ./scripts/automerge-release-pr.sh
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_PAT }}
          GH_REPO: ${{ github.repository }}

  # ---------------------------------------------------------------------------
  # Figure out which already-built dev image (by its git-SHA tag) belongs to
  # this release, and whether anything app-relevant changed since the last
  # release at all. See scripts/resolve-release-image.sh for why this can't
  # just be "the image built at this tag" — release-please's own commit only
  # touches CHANGELOG.md/VERSION, never app/ or Dockerfile.
  # ---------------------------------------------------------------------------
  resolve-image:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      changed: ${{ steps.resolve.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history required — the script walks tags and commit log.
          fetch-depth: 0

      - name: Resolve release image
        id: resolve
        run: |
          chmod +x scripts/resolve-release-image.sh
          ./scripts/resolve-release-image.sh "${{ needs.release-please.outputs.tag_name }}"

  # ---------------------------------------------------------------------------
  # Promote to staging. Retags the existing dev image with the release
  # version — no rebuild — so staging runs the exact bytes dev already ran.
  # ---------------------------------------------------------------------------
  promote-staging:
    runs-on: ubuntu-latest
    needs: [release-please, resolve-image]
    if: needs.resolve-image.outputs.changed == 'true'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Retag dev image with release version
        run: |
          chmod +x scripts/retag-ecr-image.sh
          ./scripts/retag-ecr-image.sh guestbook \
            "${{ needs.resolve-image.outputs.source_sha }}" \
            "${{ needs.release-please.outputs.version }}"

      - name: Checkout gitops repo
        uses: actions/checkout@v7
        with:
          repository: panethjonathan8-ctrl/guestbook-gitops
          token: ${{ secrets.GH_DEPLOY_PAT }}
          path: gitops

      - name: Update staging image tag
        run: |
          sed -i 's|tag: ".*"|tag: "${{ needs.release-please.outputs.version }}"|' \
            gitops/charts/guestbook/values-staging.yaml

      - name: Commit and push to gitops
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/guestbook/values-staging.yaml
          if git diff --staged --quiet; then
            echo "Image tag unchanged — skipping commit"
          else
            git commit -m "deploy(staging): guestbook@${{ needs.release-please.outputs.version }}"
            git push
          fi

      - name: Update kubeconfig for dev cluster
        run: aws eks update-kubeconfig --region ${{ vars.AWS_REGION }} --name ${{ vars.DEV_EKS_CLUSTER_NAME }}

      - name: Trigger ArgoCD sync and wait for healthy
        run: |
          kubectl patch application guestbook-staging -n argocd \
            -p '{"operation":{"sync":{"revision":"HEAD"}}}' --type=merge

          for i in $(seq 1 30); do
            SYNC=$(kubectl get application guestbook-staging -n argocd \
              -o jsonpath='{.status.sync.status}')
            HEALTH=$(kubectl get application guestbook-staging -n argocd \
              -o jsonpath='{.status.health.status}')
            echo "[$i/30] sync=$SYNC health=$HEALTH"
            [ "$SYNC" = "Synced" ] && [ "$HEALTH" = "Healthy" ] && exit 0
            [ "$i" = "30" ] && echo "Timeout waiting for ArgoCD sync" && exit 1
            sleep 10
          done

      - name: HTTP smoke test
        run: |
          ALB=$(kubectl get ingress nginx-alb -n ingress-nginx \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh "$ALB" "staging.guestbook.example.com"

      - name: DB smoke test
        run: |
          ALB=$(kubectl get ingress nginx-alb -n ingress-nginx \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          chmod +x scripts/db-smoke-test.sh
          ./scripts/db-smoke-test.sh "$ALB" "staging.guestbook.example.com"

  # ---------------------------------------------------------------------------
  # Promote to prod. Reuses the SAME version tag staging just validated —
  # no rebuild, no second retag. The tag already exists in ECR from the
  # staging step above.
  # ---------------------------------------------------------------------------
  promote-prod:
    runs-on: ubuntu-latest
    needs: [release-please, resolve-image, promote-staging]
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Checkout gitops repo
        uses: actions/checkout@v7
        with:
          repository: panethjonathan8-ctrl/guestbook-gitops
          token: ${{ secrets.GH_DEPLOY_PAT }}
          path: gitops

      - name: Update prod image tag
        run: |
          sed -i 's|tag: ".*"|tag: "${{ needs.release-please.outputs.version }}"|' \
            gitops/charts/guestbook/values-prod.yaml

      - name: Commit and push to gitops
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/guestbook/values-prod.yaml
          if git diff --staged --quiet; then
            echo "Image tag unchanged — skipping commit"
          else
            git commit -m "deploy(prod): guestbook@${{ needs.release-please.outputs.version }}"
            git push
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig for prod cluster
        run: aws eks update-kubeconfig --region ${{ vars.AWS_REGION }} --name ${{ vars.PROD_EKS_CLUSTER_NAME }}

      - name: Trigger ArgoCD sync and wait for healthy
        run: |
          kubectl patch application guestbook-prod -n argocd \
            -p '{"operation":{"sync":{"revision":"HEAD"}}}' --type=merge

          for i in $(seq 1 30); do
            SYNC=$(kubectl get application guestbook-prod -n argocd \
              -o jsonpath='{.status.sync.status}')
            HEALTH=$(kubectl get application guestbook-prod -n argocd \
              -o jsonpath='{.status.health.status}')
            echo "[$i/30] sync=$SYNC health=$HEALTH"
            [ "$SYNC" = "Synced" ] && [ "$HEALTH" = "Healthy" ] && exit 0
            [ "$i" = "30" ] && echo "Timeout waiting for ArgoCD sync" && exit 1
            sleep 10
          done

      - name: HTTP smoke test
        run: |
          ALB=$(kubectl get ingress nginx-alb -n ingress-nginx \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh "$ALB" "guestbook.example.com"
