repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key

  # Block any AWS credentials from being committed.
  # Catches access key IDs (AKIA...), secret keys, and PEM private keys.
  - repo: local
    hooks:
      - id: no-aws-secrets
        name: no-aws-secrets
        language: pygrep
        entry: '(AKIA[0-9A-Z]{16}|aws_secret_access_key\s*=\s*[A-Za-z0-9/+]{40}|-----BEGIN .* PRIVATE KEY-----)'
        types: [text]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [check, app/]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
